<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Pay with GamRemit</title>
  <link rel="icon" type="image/png" href="/logos/gamremit-logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#07090F;--s1:#0D1220;--s2:#131A2E;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--green:#00D48C;--blue:#1246F5;--blue2:#2A5AFF;--gold:#F0A033;--red:#FF4D6A;--muted:rgba(255,255,255,.45);--font:'Sora',sans-serif;--mono:'Space Mono',monospace}
    body{font-family:var(--font);background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
    .bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none}
    .bg-fx::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(18,70,245,.07),transparent 70%);top:-200px;right:-100px}
    .bg-fx::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,140,.05),transparent 70%);bottom:-100px;left:-100px}
    .card{position:relative;z-index:10;background:var(--s1);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:440px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.5)}
    .card-hdr{padding:22px 26px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(18,70,245,.08),rgba(0,212,140,.04))}
    .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .logo-row img{height:32px;width:auto}
    .logo-row span{font-size:.75rem;color:var(--muted)}
    .card-body{padding:26px}
    .amount-block{text-align:center;padding:20px;background:rgba(0,212,140,.06);border:1px solid rgba(0,212,140,.15);border-radius:14px;margin-bottom:20px}
    .amount-big{font-size:2.4rem;font-weight:800;font-family:var(--mono);letter-spacing:.04em}
    .amount-cur{font-size:.85rem;color:var(--green);font-weight:700;margin-top:4px}
    .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.82rem}
    .info-row:last-child{border-bottom:none}
    .info-label{color:var(--muted)}
    .info-val{font-weight:700;text-align:right;max-width:60%;word-break:break-all}
    .status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 13px;border-radius:100px;font-size:.72rem;font-weight:700}
    .sb-pending{background:rgba(18,70,245,.12);border:1px solid rgba(18,70,245,.25);color:#8ab4ff}
    .sb-paid{background:rgba(0,212,140,.1);border:1px solid rgba(0,212,140,.25);color:var(--green)}
    .sb-cancelled{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted)}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
    .field input{width:100%;padding:11px 13px;background:rgba(255,255,255,.06);border:1.5px solid var(--border2);border-radius:10px;font-family:var(--font);font-size:.88rem;color:#fff;outline:none;transition:.2s}
    .field input:focus{border-color:var(--blue);background:rgba(18,70,245,.06)}
    .btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;border-radius:12px;font-family:var(--font);font-size:.95rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 20px rgba(18,70,245,.4);transition:.25s;margin-top:4px}
    .btn:hover:not(:disabled){transform:translateY(-1px)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-secondary{background:rgba(255,255,255,.06);border:1px solid var(--border2);color:rgba(255,255,255,.7);box-shadow:none}
    .form-err{padding:10px 13px;background:rgba(255,77,106,.09);border:1px solid rgba(255,77,106,.2);border-radius:9px;font-size:.8rem;color:#ff7090;margin-bottom:12px;display:none}
    .form-ok{padding:10px 13px;background:rgba(0,212,140,.08);border:1px solid rgba(0,212,140,.2);border-radius:9px;font-size:.8rem;color:var(--green);margin-bottom:12px;display:none}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    .success-screen{text-align:center;padding:20px 0}
    .success-icon{font-size:3.5rem;margin-bottom:14px}
    .arc-strip{margin-top:16px;padding:10px 14px;background:rgba(0,212,140,.05);border:1px solid rgba(0,212,140,.12);border-radius:10px;font-size:.72rem;color:var(--muted);text-align:center}
    .arc-strip strong{color:var(--green)}
    .loading-state{text-align:center;padding:40px 20px;color:var(--muted)}
    @media(max-width:480px){.card{border-radius:14px}.card-body{padding:18px}}
  </style>
</head>
<body>
<div class="bg-fx"></div>

<div class="card" id="mainCard">
  <div class="card-hdr">
    <div class="logo-row">
      <img src="/logos/gamremit-logo.png" alt="GamRemit"/>
      <span>Payment Request</span>
    </div>
    <div id="statusRow"></div>
  </div>
  <div class="card-body">
    <div class="loading-state" id="loadingState">⏳ Loading payment request...</div>
    <div id="prContent" style="display:none"></div>
    <div id="payForm" style="display:none">
      <div class="field">
        <label>Your Name</label>
        <input type="text" id="payerName" placeholder="Your full name"/>
      </div>
      <div class="field">
        <label>Your Email</label>
        <input type="email" id="payerEmail" placeholder="your@email.com"/>
      </div>
      <div class="field">
        <label>Wallet Address (Arc Testnet)</label>
        <input type="text" id="payerWallet" placeholder="0x... or yourname.arc"/>
      </div>
      <div class="form-err" id="payErr"></div>
      <button class="btn" id="payNowBtn" onclick="payNow()">
        <span class="spinner" id="payNowSpin"></span>
        <span id="payNowTxt">💳 Pay Now</span>
      </button>
      <a href="/" style="display:block;margin-top:10px;text-decoration:none">
        <button class="btn btn-secondary" type="button">← Sign in to GamRemit to pay faster</button>
      </a>
    </div>
    <div id="paidState" style="display:none">
      <div class="success-screen">
        <div class="success-icon">🎉</div>
        <div style="font-size:1.1rem;font-weight:800;margin-bottom:8px">Payment Received!</div>
        <div style="font-size:.82rem;color:var(--muted);line-height:1.7">This payment request has been fulfilled successfully.</div>
      </div>
    </div>
    <div id="cancelledState" style="display:none">
      <div class="success-screen">
        <div class="success-icon">❌</div>
        <div style="font-size:1.1rem;font-weight:800;margin-bottom:8px">Request Cancelled</div>
        <div style="font-size:.82rem;color:var(--muted);line-height:1.7">This payment request is no longer active.</div>
      </div>
    </div>
    <div class="arc-strip">Powered by <strong>Arc Testnet</strong> · Circle USDC · CCTP V2</div>
  </div>
</div>

<script>
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? `${location.protocol}//${location.hostname}:${location.port}`
  : '';

// Extract payment request code from URL: /pay/XXXXXXXX
const pathParts = location.pathname.split('/').filter(Boolean);
const code = pathParts[pathParts.length - 1];

let prData = null;

function showErr(id, msg)  { const el = document.getElementById(id); if(el){el.textContent = msg; el.style.display = 'block';} }
function hideMsg(id)       { const el = document.getElementById(id); if(el) el.style.display = 'none'; }

async function loadPR() {
  if (!code) {
    document.getElementById('loadingState').innerHTML = '<div style="color:var(--red)">⚠ Invalid payment link</div>';
    return;
  }
  try {
    const res  = await fetch(`${API}/api/pay/requests/${code}`);
    const data = await res.json();

    if (!data.success || !data.paymentRequest) {
      document.getElementById('loadingState').innerHTML = '<div style="color:var(--red)">⚠ Payment request not found or expired.</div>';
      return;
    }

    prData = data.paymentRequest;
    document.getElementById('loadingState').style.display = 'none';

    // Status badge
    const statusBadge = {
      pending:   '<span class="status-badge sb-pending">⏳ Pending Payment</span>',
      paid:      '<span class="status-badge sb-paid">✅ Paid</span>',
      cancelled: '<span class="status-badge sb-cancelled">❌ Cancelled</span>',
    };
    document.getElementById('statusRow').innerHTML = statusBadge[prData.status] || '';

    // PR info block
    const isExpired = new Date(prData.expiresAt) < new Date();
    document.getElementById('prContent').style.display = 'block';
    document.getElementById('prContent').innerHTML = `
      <div class="amount-block">
        <div class="amount-big">${parseFloat(prData.amount).toFixed(2)}</div>
        <div class="amount-cur">${prData.currency}</div>
      </div>
      <div style="margin-bottom:18px">
        <div class="info-row"><span class="info-label">From</span><span class="info-val">${prData.creatorName}</span></div>
        <div class="info-row"><span class="info-label">Description</span><span class="info-val">${prData.description}</span></div>
        <div class="info-row"><span class="info-label">Created</span><span class="info-val">${new Date(prData.createdAt).toLocaleDateString('en-GB')}</span></div>
        <div class="info-row"><span class="info-label">Expires</span><span class="info-val" style="color:${isExpired ? 'var(--red)' : 'var(--muted)'}">${new Date(prData.expiresAt).toLocaleDateString('en-GB')}${isExpired ? ' (Expired)' : ''}</span></div>
        <div class="info-row"><span class="info-label">Network</span><span class="info-val" style="color:var(--green)">⬡ Arc Testnet</span></div>
        <div class="info-row"><span class="info-label">Request ID</span><span class="info-val" style="font-family:var(--mono);font-size:.72rem;color:#8ab4ff">${prData.code}</span></div>
      </div>
    `;

    // Show correct state
    if (prData.status === 'paid') {
      document.getElementById('paidState').style.display = 'block';
    } else if (prData.status === 'cancelled' || isExpired) {
      document.getElementById('cancelledState').style.display = 'block';
    } else {
      document.getElementById('payForm').style.display = 'block';
    }

  } catch (e) {
    document.getElementById('loadingState').innerHTML = '<div style="color:var(--red)">⚠ Network error. Please refresh.</div>';
  }
}

async function payNow() {
  hideMsg('payErr');
  const name   = document.getElementById('payerName').value.trim();
  const email  = document.getElementById('payerEmail').value.trim();
  const wallet = document.getElementById('payerWallet').value.trim();

  if (!name)   { showErr('payErr', 'Your name is required'); return; }
  if (!wallet) { showErr('payErr', 'Wallet address required'); return; }

  const btn = document.getElementById('payNowBtn');
  btn.disabled = true;
  document.getElementById('payNowSpin').style.display = 'block';
  document.getElementById('payNowTxt').textContent = 'Processing...';

  try {
    // Simulate USDC transfer from payer wallet to creator wallet on Arc Testnet
    // In production: call Arc Testnet USDC contract via ethers.js / wagmi
    const txHash = `0x${Array.from({length:64}, () => Math.floor(Math.random()*16).toString(16)).join('')}`;

    // Mark request as paid
    const res  = await fetch(`${API}/api/pay/requests/${code}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ txHash, payerName: name, payerEmail: email, payerWallet: wallet })
    });
    const data = await res.json();

    if (!data.success) { showErr('payErr', data.error || 'Payment failed'); return; }

    // Show success
    document.getElementById('payForm').style.display   = 'none';
    document.getElementById('paidState').style.display = 'block';
    document.getElementById('statusRow').innerHTML = '<span class="status-badge sb-paid">✅ Paid</span>';
    document.getElementById('prContent').querySelector('.amount-block').style.background = 'rgba(0,212,140,.1)';

  } catch { showErr('payErr', 'Network error. Please retry.'); }
  finally {
    btn.disabled = false;
    document.getElementById('payNowSpin').style.display = 'none';
    document.getElementById('payNowTxt').textContent = '💳 Pay Now';
  }
}

loadPR();
</script>
</body>
</html>
