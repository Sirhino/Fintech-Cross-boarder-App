<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Applied synchronously, before CSS renders, so there's no flash of
    // the wrong theme on load, and so the choice made on the dashboard
    // (app.html) carries over to this page too.
    (function() {
      try {
        var saved = localStorage.getItem('gr_theme');
        if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GamRemit — Withdraw to Bank</title>
<link rel="icon" type="image/png" href="logos/gamremit-logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090F;--s1:#0D1220;--s2:#131A2E;--s3:#1A2340;
  --border:rgba(var(--overlay-rgb),.06);--border2:rgba(var(--overlay-rgb),.11);
  --green:#00D48C;--blue:#1246F5;--blue2:#2A5AFF;--gold:#F0A033;--red:#FF4D6A;
  --muted:rgba(var(--overlay-rgb),.45);--dimmed:rgba(var(--overlay-rgb),.2);
  --font:'Sora',sans-serif;--mono:'Space Mono',monospace;
  --text:#fff;--overlay-rgb:255,255,255;
}
/* ── LIGHT THEME ── same pattern/values as app.html, so the theme picked
   on the dashboard applies consistently here too. */
[data-theme="light"]{
  --bg:#F4F6FB;--s1:#FFFFFF;--s2:#F0F2F8;--s3:#E7EAF3;
  --border:rgba(10,14,30,.08);--border2:rgba(10,14,30,.14);
  --muted:rgba(10,14,30,.5);--dimmed:rgba(10,14,30,.28);
  --text:#0B0E1A;--overlay-rgb:10,14,30;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.back{color:var(--muted);text-decoration:none;font-size:.85rem;display:flex;align-items:center;gap:6px}
.back:hover{color:var(--text)}
h1{font-size:1.3rem;font-weight:800}
.card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px}

/* step indicator */
.steps{display:flex;justify-content:space-between;margin-bottom:26px;position:relative}
.steps::before{content:'';position:absolute;top:13px;left:0;right:0;height:2px;background:var(--border)}
.step{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;background:var(--s2);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;color:var(--muted)}
.step.active{background:var(--blue);border-color:var(--blue);color:#fff}
.step.done{background:var(--green);border-color:var(--green);color:#042}

label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.input,select.input{width:100%;padding:13px 14px;background:var(--s2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--font);font-size:.92rem;outline:none;transition:.2s}
.input:focus{border-color:var(--blue)}
.field{margin-bottom:16px}
.hint{font-size:.72rem;color:var(--muted);margin-top:6px}
.hint.err{color:var(--red)}

.country-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.country-opt{display:flex;align-items:center;gap:10px;padding:14px;background:var(--s2);border:1px solid var(--border2);border-radius:12px;cursor:pointer;transition:.15s}
.country-opt:hover{border-color:var(--blue)}
.country-opt.sel{border-color:var(--blue);background:rgba(18,70,245,.12)}
.country-opt .flag{font-size:1.4rem}
.country-opt .cname{font-size:.82rem;font-weight:700}
.country-opt .ccode{font-size:.68rem;color:var(--muted)}

.btn-primary{padding:13px 20px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:none;border-radius:10px;font-family:var(--font);font-size:.9rem;font-weight:700;cursor:pointer;width:100%;box-shadow:0 4px 18px rgba(18,70,245,.35);transition:.2s}
.btn-primary:hover:not(:disabled){transform:translateY(-1px)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-outline{padding:13px 18px;background:rgba(var(--overlay-rgb),.05);border:1px solid var(--border2);color:rgba(var(--overlay-rgb),.7);border-radius:10px;font-family:var(--font);font-size:.85rem;font-weight:600;cursor:pointer;width:100%;margin-top:10px;transition:.2s}
.btn-outline:hover{background:rgba(var(--overlay-rgb),.09)}
.btn-row{display:flex;gap:10px;margin-top:4px}
.btn-row .btn-outline{margin-top:0;flex:1}
.btn-row .btn-primary{flex:2}

.acct-verified{display:flex;align-items:center;gap:10px;padding:13px;background:rgba(0,212,140,.1);border:1px solid rgba(0,212,140,.3);border-radius:10px;margin-top:10px;font-size:.85rem;font-weight:700;color:var(--green)}
.saved-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.saved-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--s2);border:1px solid var(--border);border-radius:10px;cursor:pointer}
.saved-item:hover{border-color:var(--blue)}
.saved-item .sn{font-size:.85rem;font-weight:700}
.saved-item .sb{font-size:.7rem;color:var(--muted)}

.quote-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.quote-row:last-child{border-bottom:none}
.quote-row .ql{color:var(--muted)}
.quote-row .qv{font-weight:700;font-family:var(--mono)}
.quote-total{display:flex;justify-content:space-between;padding:16px 0 4px;font-size:1.1rem;font-weight:800}
.quote-total .qv{color:var(--green);font-family:var(--mono)}

.status-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 16px}
.status-icon.pending,.status-icon.transferring_onchain{background:rgba(240,160,51,.15);color:var(--gold)}
.status-icon.processing{background:rgba(18,70,245,.15);color:var(--blue2)}
.status-icon.completed{background:rgba(0,212,140,.15);color:var(--green)}
.status-icon.failed{background:rgba(255,77,106,.15);color:var(--red)}
.spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-title{text-align:center;font-size:1.05rem;font-weight:800;margin-bottom:4px}
.status-sub{text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:20px}
.ref-box{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--s2);border:1px solid var(--border);border-radius:10px;font-family:var(--mono);font-size:.78rem}
.copy-btn{background:none;border:none;color:var(--blue2);cursor:pointer;font-size:.72rem;font-weight:700}

.error-box{padding:12px 14px;background:rgba(255,77,106,.1);border:1px solid rgba(255,77,106,.3);border-radius:10px;color:var(--red);font-size:.82rem;margin-bottom:14px;display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;font-size:.85rem;font-weight:600;z-index:999;display:none}
.toast.show{display:block}
.toast.ok{background:var(--green);color:#042}
.toast.err{background:var(--red);color:#fff}
.skel{background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;height:14px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#07090F">
  <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="app.html" class="back">← Back to dashboard</a>
  </div>
  <h1 style="margin-bottom:18px">Withdraw to Bank</h1>

  <div class="steps" id="stepsBar"></div>
  <div class="error-box" id="errBox"></div>
  <div id="screen"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? `${location.protocol}//${location.hostname}:${location.port}` : '';
const token = localStorage.getItem('gr_token');
if (!token) location.href = 'index.html';

const STEP_LABELS = ['Country','Bank','Verify','Amount','Quote','Confirm','Status'];
let step = 1;
const state = {
  country: null, countries: [],
  institutions: [], institutionCode: null, institutionName: null,
  accountNumber: '', accountName: '',
  usdcAmount: '', quote: null,
  reference: null, providerId: null, status: 'pending',
};

function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 2500);
}
function showErr(msg) {
  const box = document.getElementById('errBox');
  if (!msg) { box.style.display = 'none'; return; }
  box.textContent = msg; box.style.display = 'block';
}
async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(`${API}/api${path}`, {
      ...opts,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...(opts.headers||{}) },
    });
  } catch {
    throw new Error('Could not reach GamRemit. Please check your connection and try again.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong on our end. Please try again in a moment.');
  return data;
}

function renderSteps() {
  document.getElementById('stepsBar').innerHTML = STEP_LABELS.map((_, i) => {
    const n = i + 1;
    const cls = n < step ? 'done' : n === step ? 'active' : '';
    return `<div class="step ${cls}">${n < step ? '✓' : n}</div>`;
  }).join('');
}

function goto(n) { step = n; showErr(''); renderSteps(); render(); }

// ── Step 1: Country ──────────────────────────────────────────────
async function renderStep1() {
  const el = document.getElementById('screen');
  el.innerHTML = `<div class="card"><div class="skel" style="height:80px"></div></div>`;
  if (!state.countries.length) {
    try { state.countries = (await api('/withdrawal/countries')).countries; }
    catch (e) { showErr(e.message); return; }
  }
  el.innerHTML = `
    <div class="card">
      <label>Select destination country</label>
      <div class="country-grid" id="countryGrid"></div>
      <button class="btn-primary" id="contBtn" style="margin-top:18px" disabled>Continue</button>
    </div>`;
  const grid = document.getElementById('countryGrid');
  grid.innerHTML = state.countries.map(c => `
    <div class="country-opt ${state.country?.code===c.code?'sel':''}" data-code="${c.code}">
      <span class="flag">${c.flag}</span>
      <div><div class="cname">${c.name}</div><div class="ccode">${c.currency} · min ${c.min.toLocaleString()}</div></div>
    </div>`).join('');
  grid.querySelectorAll('.country-opt').forEach(opt => {
    opt.onclick = () => {
      grid.querySelectorAll('.country-opt').forEach(o => o.classList.remove('sel'));
      opt.classList.add('sel');
      state.country = state.countries.find(c => c.code === opt.dataset.code);
      document.getElementById('contBtn').disabled = false;
    };
  });
  document.getElementById('contBtn').onclick = () => goto(2);
}

// ── Step 2: Bank account form (+ saved accounts) ─────────────────
async function renderStep2() {
  const el = document.getElementById('screen');
  el.innerHTML = `<div class="card"><div class="skel" style="height:120px"></div></div>`;
  let saved = [];
  try { saved = (await api('/withdrawal/saved-accounts')).accounts.filter(a => a.currency === state.country.currency); } catch {}
  let bankUnavailableReason = '';
  if (!state.institutions.length) {
    try {
      const r = await api(`/withdrawal/institutions?currency=${state.country.currency}`);
      state.institutions = r.institutions || [];
      if (r.available === false) bankUnavailableReason = r.reason || '';
    }
    catch (e) { showErr(e.message); }
  }
  el.innerHTML = `
    <div class="card">
      ${saved.length ? `
        <label>Saved accounts</label>
        <div class="saved-list" id="savedList"></div>
        <div style="text-align:center;font-size:.7rem;color:var(--muted);margin-bottom:14px">— or enter a new account —</div>
      ` : ''}
      <div class="field">
        <label>Bank / Institution</label>
        ${state.institutions.length ? `
          <select class="input" id="instSel">
            <option value="">Select bank…</option>
            ${state.institutions.map(i => `<option value="${i.code}" data-name="${i.name}">${i.name}</option>`).join('')}
          </select>
        ` : `
          <div class="input" style="color:var(--muted);display:flex;align-items:center;cursor:default">
            ${bankUnavailableReason || `No banks available for ${state.country.name} right now — please try again shortly or contact support.`}
          </div>
        `}
      </div>
      <div class="field">
        <label>Account number</label>
        <input class="input" id="acctNum" placeholder="0123456789" inputmode="numeric"/>
      </div>
      <button class="btn-primary" id="contBtn" disabled>Verify account</button>
      <button class="btn-outline" id="backBtn">Back</button>
    </div>`;
  if (saved.length) {
    document.getElementById('savedList').innerHTML = saved.map(a => `
      <div class="saved-item" data-id="${a.id}" style="display:flex;align-items:center;gap:8px">
        <button class="star-toggle" data-star-id="${a.id}" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:2px;flex-shrink:0" title="${a.favorite ? 'Unstar' : 'Star as favorite'}">${a.favorite ? '⭐' : '☆'}</button>
        <div style="flex:1;cursor:pointer" data-use-id="${a.id}"><div class="sn">${a.accountName}</div><div class="sb">${a.institutionName} · ${a.accountNumber}</div></div>
        <span style="color:var(--blue2);font-size:.75rem;font-weight:700;cursor:pointer" data-use-id="${a.id}">Use →</span>
      </div>`).join('');
    document.querySelectorAll('[data-use-id]').forEach(it => it.onclick = () => {
      const a = saved.find(s => s.id === it.dataset.useId);
      state.institutionCode = a.institutionCode; state.institutionName = a.institutionName;
      state.accountNumber = a.accountNumber; state.accountName = a.accountName;
      goto(4); // skip verify since it's already a known-good saved account
    });
    document.querySelectorAll('[data-star-id]').forEach(btn => btn.onclick = async (e) => {
      e.stopPropagation();
      const a = saved.find(s => s.id === btn.dataset.starId);
      const next = !a.favorite;
      btn.textContent = next ? '⭐' : '☆';
      try { await api(`/withdrawal/saved-accounts?id=${a.id}`, { method: 'PATCH', body: JSON.stringify({ favorite: next }) }); a.favorite = next; }
      catch { btn.textContent = a.favorite ? '⭐' : '☆'; }
    });
  }
  const checkReady = () => {
    const inst = document.getElementById('instSel');
    document.getElementById('contBtn').disabled = !(inst && inst.value && document.getElementById('acctNum').value.trim().length >= 4);
  };
  const instEl = document.getElementById('instSel');
  if (instEl) instEl.onchange = checkReady;
  document.getElementById('acctNum').oninput = checkReady;
  document.getElementById('backBtn').onclick = () => goto(1);
  document.getElementById('contBtn').onclick = async () => {
    const sel = document.getElementById('instSel');
    if (!sel || !sel.value) return;
    state.institutionCode = sel.value;
    state.institutionName = sel.options[sel.selectedIndex].dataset.name;
    state.accountNumber = document.getElementById('acctNum').value.trim();
    goto(3);
  };
}

// ── Step 3: Verify account ───────────────────────────────────────
async function renderStep3() {
  const el = document.getElementById('screen');
  el.innerHTML = `
    <div class="card" style="text-align:center">
      <div class="skel" style="height:18px;width:60%;margin:0 auto 10px"></div>
      <div class="skel" style="height:14px;width:40%;margin:0 auto"></div>
    </div>`;
  try {
    const res = await api('/withdrawal/verify-account', {
      method: 'POST',
      body: JSON.stringify({ accountNumber: state.accountNumber, institutionCode: state.institutionCode, currency: state.country.currency }),
    });
    state.accountName = res.accountName || 'Unknown';
    el.innerHTML = `
      <div class="card">
        <div class="acct-verified">✅ ${state.accountName}</div>
        <div class="hint" style="margin-top:10px">${state.institutionName} · ${state.accountNumber}</div>
        <label style="margin-top:18px">Save this account for next time?</label>
        <div class="btn-row">
          <button class="btn-outline" id="skipSave">Skip</button>
          <button class="btn-primary" id="saveAcct">Save & continue</button>
        </div>
      </div>`;
    document.getElementById('skipSave').onclick = () => goto(4);
    document.getElementById('saveAcct').onclick = async () => {
      try {
        await api('/withdrawal/saved-accounts', {
          method: 'POST',
          body: JSON.stringify({
            accountNumber: state.accountNumber, institutionCode: state.institutionCode,
            institutionName: state.institutionName, currency: state.country.currency, accountName: state.accountName,
          }),
        });
      } catch {}
      goto(4);
    };
  } catch (e) {
    el.innerHTML = `
      <div class="card">
        <div class="error-box" style="display:block">${e.message}</div>
        <button class="btn-outline" id="backBtn">Try a different account</button>
      </div>`;
    document.getElementById('backBtn').onclick = () => goto(2);
  }
}

// ── Step 4: Amount ───────────────────────────────────────────────
function renderStep4() {
  const el = document.getElementById('screen');
  el.innerHTML = `
    <div class="card">
      <div class="acct-verified" style="margin-bottom:18px">✅ ${state.accountName || state.institutionName}</div>
      <div class="field">
        <label>Amount to withdraw (USDC)</label>
        <input class="input" id="amtInput" placeholder="0.00" inputmode="decimal" value="${state.usdcAmount}"/>
        <div class="hint">Min ${state.country.min.toLocaleString()} · Max ${state.country.max.toLocaleString()} ${state.country.currency} equivalent</div>
      </div>
      <button class="btn-primary" id="contBtn">Get quote</button>
      <button class="btn-outline" id="backBtn">Back</button>
    </div>`;
  document.getElementById('backBtn').onclick = () => goto(2);
  document.getElementById('contBtn').onclick = async () => {
    const amt = parseFloat(document.getElementById('amtInput').value);
    if (!Number.isFinite(amt) || amt <= 0) { showErr('Enter a valid amount'); return; }
    state.usdcAmount = amt;
    showErr('');
    goto(5);
  };
}

// ── Step 5: Quote ────────────────────────────────────────────────
async function renderStep5() {
  const el = document.getElementById('screen');
  el.innerHTML = `<div class="card"><div class="skel" style="height:160px"></div></div>`;
  try {
    const q = await api('/withdrawal/quote', {
      method: 'POST',
      body: JSON.stringify({ usdcAmount: state.usdcAmount, currency: state.country.currency, accountNumber: state.accountNumber, institutionCode: state.institutionCode }),
    });
    state.quote = q;
    el.innerHTML = `
      <div class="card">
        <div class="quote-row"><span class="ql">You send</span><span class="qv">${state.usdcAmount} USDC</span></div>
        <div class="quote-row"><span class="ql">Exchange rate</span><span class="qv">${q.exchangeRate ?? '—'}</span></div>
        <div class="quote-row"><span class="ql">Network fee</span><span class="qv">${q.networkFee} USDC</span></div>
        <div class="quote-row"><span class="ql">Recipient</span><span class="qv" style="font-family:var(--font)">${state.accountName||'—'}</span></div>
        <div class="quote-row"><span class="ql">Estimated arrival</span><span class="qv" style="font-family:var(--font)">${q.estimatedArrivalTime}</span></div>
        <div class="quote-total"><span>You receive</span><span class="qv">${(q.amountReceived ?? '—')} ${state.country.currency}</span></div>
        <div class="hint" style="margin-top:6px">Quote expires in 3 minutes</div>
        <button class="btn-primary" id="contBtn" style="margin-top:16px">Confirm withdrawal</button>
        <button class="btn-outline" id="backBtn">Back</button>
      </div>`;
    document.getElementById('backBtn').onclick = () => goto(4);
    document.getElementById('contBtn').onclick = () => goto(6);
  } catch (e) {
    el.innerHTML = `<div class="card"><div class="error-box" style="display:block">${e.message}</div><button class="btn-outline" id="backBtn">Back</button></div>`;
    document.getElementById('backBtn').onclick = () => goto(4);
  }
}

// ── Step 6: Confirm & execute ─────────────────────────────────────
function renderStep6() {
  const el = document.getElementById('screen');
  el.innerHTML = `
    <div class="card">
      <p style="font-size:.88rem;color:var(--muted);margin-bottom:16px">Final review — this cannot be undone once submitted.</p>
      <div class="quote-row"><span class="ql">Send</span><span class="qv">${state.usdcAmount} USDC</span></div>
      <div class="quote-row"><span class="ql">To</span><span class="qv" style="font-family:var(--font)">${state.accountName} · ${state.institutionName}</span></div>
      <div class="quote-total"><span>Receive</span><span class="qv">${state.quote.amountReceived} ${state.country.currency}</span></div>
      <button class="btn-primary" id="confirmBtn" style="margin-top:18px">Confirm & withdraw</button>
      <button class="btn-outline" id="backBtn">Back</button>
    </div>`;
  document.getElementById('backBtn').onclick = () => goto(5);
  document.getElementById('confirmBtn').onclick = async () => {
    const btn = document.getElementById('confirmBtn');
    btn.disabled = true; btn.textContent = 'Submitting…';
    try {
      const res = await api('/withdrawal/execute', {
        method: 'POST',
        body: JSON.stringify({ quoteId: state.quote.quoteId, recipientName: state.accountName }),
      });
      state.reference = res.reference; state.providerId = res.providerId; state.status = (res.status||'PENDING').toLowerCase();
      goto(7);
    } catch (e) {
      showErr(e.message); btn.disabled = false; btn.textContent = 'Confirm & withdraw';
    }
  };
}

// ── Step 7: Status (polling) ─────────────────────────────────────
let pollTimer = null;
function renderStep7() {
  drawStatus();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const s = await api(`/withdrawal/status/${state.reference}`);
      state.status = s.status;
      state.quote.amountReceived = s.receiveAmount ?? state.quote.amountReceived;
      state.failureReason = s.failureReason;
      drawStatus();
      if (['completed', 'failed', 'payout_failed_needs_review'].includes(s.status)) clearInterval(pollTimer);
    } catch {}
  }, 5000);
}
function drawStatus() {
  const el = document.getElementById('screen');
  const icons = {
    transferring_onchain: '⛓️', pending: '⏳', processing: '🔄',
    completed: '✅', failed: '❌', payout_failed_needs_review: '⚠️',
  };
  const titles = {
    transferring_onchain: 'Confirming on-chain transfer',
    pending: 'Withdrawal submitted', processing: 'Processing your withdrawal',
    completed: 'Withdrawal successful!', failed: 'Withdrawal failed',
    payout_failed_needs_review: 'Funds received — payout delayed',
  };
  const subs = {
    transferring_onchain: 'Moving your USDC on-chain. This can take a minute or two depending on network conditions.',
    pending: 'Waiting for the payout to start…', processing: 'This usually takes a few minutes.',
    completed: `${state.quote.amountReceived} ${state.country.currency} sent to ${state.accountName}`,
    failed: state.failureReason || 'Something went wrong before any funds were deducted.',
    payout_failed_needs_review: 'Your USDC arrived safely, but the bank payout hit a snag. Our team has been alerted and is on it — no action needed from you.',
  };
  const spinning = ['transferring_onchain', 'processing'].includes(state.status);
  el.innerHTML = `
    <div class="card" style="text-align:center">
      <div class="status-icon ${state.status === 'payout_failed_needs_review' ? 'failed' : state.status}"><span class="${spinning?'spin':''}">${icons[state.status]}</span></div>
      <div class="status-title">${titles[state.status]}</div>
      <div class="status-sub">${subs[state.status]}</div>
      <div class="ref-box">
        <span>${state.reference}</span>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      ${['completed','failed','payout_failed_needs_review'].includes(state.status) ? `<button class="btn-primary" style="margin-top:18px" onclick="location.href='app.html'">Done</button>` : `<div class="hint" style="margin-top:14px">This page updates automatically</div>`}
    </div>`;
  document.getElementById('copyBtn').onclick = () => {
    navigator.clipboard.writeText(state.reference);
    showToast('Reference copied');
  };
}

function render() {
  showErr('');
  ({1:renderStep1,2:renderStep2,3:renderStep3,4:renderStep4,5:renderStep5,6:renderStep6,7:renderStep7})[step]();
}

renderSteps();
render();
</script>
</body>
